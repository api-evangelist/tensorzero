aid: tensorzero
name: TensorZero
description: >-
  TensorZero is an open-source, self-hosted LLMOps platform that unifies five
  capabilities behind one stack: a high-performance LLM Gateway that accesses
  every major model provider (Anthropic, OpenAI, AWS Bedrock/SageMaker, Azure,
  GCP Vertex, Mistral, Groq, xAI and more) through a single OpenAI-compatible
  API with sub-millisecond p99 overhead; Observability that stores inferences
  and feedback in your own database; Evaluation via heuristics and LLM judges;
  Optimization of prompts, models, and inference strategies from metrics and
  human feedback; and Experimentation with built-in A/B testing, routing,
  retries, and fallbacks. Written in Rust and deployed as a single Docker
  container, it plays nicely with the OpenAI SDK and OpenTelemetry. NOTE: as of
  2026 TensorZero is no longer maintained — the source remains available on
  GitHub (all org repositories archived) and the final Python client (2026.6.0)
  is on PyPI, but the hosted product has wound down.
